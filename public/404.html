<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Redirecting…</title>
<script>
  // spa-github-pages fallback. GitHub Pages serves this file for any unknown path.
  // We stash the requested path/query/hash in sessionStorage, then bounce to the
  // SPA entry point, which reads it back and calls history.replaceState.
  // The segmentCount (1) matches the number of path segments in the repo name
  // (e.g. "/ai-dispatcher-web/" is one segment).
  (function () {
    var segmentCount = 1;
    var l = window.location;
    sessionStorage.setItem(
      'spa-redirect',
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') +
        '/?p=/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
    );
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/'
    );
  })();
</script>
</head>
<body></body>
</html>
