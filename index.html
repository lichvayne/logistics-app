<script>
  // spa-github-pages: restore the real path stashed by 404.html before the SPA boots.
  (function () {
    var l = window.location;
    if (l.search.slice(1).indexOf('p=/') === 0 || l.search.indexOf('&p=/') > 0) {
      var q = l.search.slice(1).split('&').reduce(function (acc, kv) {
        var i = kv.indexOf('='); if (i < 0) return acc;
        acc[kv.slice(0, i)] = kv.slice(i + 1); return acc;
      }, {});
      if (q.p !== undefined) {
        var path = (q.p || '').replace(/~and~/g, '&');
        var search = q.q ? '?' + q.q.replace(/~and~/g, '&') : '';
        window.history.replaceState(null, '', l.pathname.slice(0, -1) + path + search + l.hash);
      }
    }
  })();
</script>
